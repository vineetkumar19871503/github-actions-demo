name: "Demo Action on Project"
description: "Just echoes for now"

inputs:
  node-version:
    required: false
    default: "22"

runs:
  using: "composite"

  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    - run: echo "Node version in custom action"
    - run: echo ${{ inputs.node-version }}
      shell: bash
