name: Demo CI

on:
  push:
    branches:
      - main
      - test-demo
      - demo
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "GitHub Actions is working!"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Unit Tests with Coverage
        run: npm run test:coverage
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: ls -la
      - name: Setup Node.js environment
        env:
          APP_SECRET_NAME: ${{ secrets.APP_SECRET_NAME }}
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22
          cache: 'npm'
      - run: node -v
      - run: npm -v
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          overwrite: true
          include-hidden-files: true
    deploy:
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
